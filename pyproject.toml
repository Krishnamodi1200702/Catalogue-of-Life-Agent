[project]
name = "CoL"
version = "0.1.0"
description = "description"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ichatbio-sdk~=0.2.7",
    "a2a-sdk[sqlite]",
    "python-dotenv>=0.9.9,<2.0.0",
    "openai~=1.79.0",
    "instructor~=1.8.2",
    "pydantic~>=2.12.5",
    "requests",
    "sqlalchemy",
    "aiosqlite",
    "pytest~=9.0.2"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]